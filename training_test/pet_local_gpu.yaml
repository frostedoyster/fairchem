epochs: 100

job:
  device_type: CUDA
  debug: True
  run_dir: ${oc.env:PWD}/runs
  run_name: pet_dummy_ethanol

tasks:
  # - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  #   name: energy
  #   level: system
  #   property: energy
  #   loss_fn:
  #     _target_: fairchem.core.modules.loss.DDPMTLoss
  #     loss_fn: {_target_: fairchem.core.modules.loss.PerAtomMAELoss}
  #     coefficient: 1
  #   out_spec: {dim: [1], dtype: float32}
  #   normalizer: {_target_: fairchem.core.modules.normalization.normalizer.Normalizer, mean: 0.0, rmsd: 1.0}
  #   datasets: [ethanol]
  #   metrics: [per_atom_mae]
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: forces
    level: atom
    property: forces
    train_on_free_atoms: True
    eval_on_free_atoms: True
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.L2NormLoss}
      reduction: mean
      coefficient: 1
    out_spec: {dim: [3], dtype: float32}
    normalizer: {_target_: fairchem.core.modules.normalization.normalizer.Normalizer, mean: 0.0, rmsd: 1.195398394564808}
    datasets: [ethanol]
    metrics: [mae]

ethanol_train_dataset: &ethanol_dataset
  format: ase_db
  splits: {train: {src: "${oc.env:PWD}/ethanol_train_0.db", sample_n: 900, seed: 0}}
  a2g_args: {r_forces: True, r_edges: True, max_neigh: 1000, radius: 5.0, molecule_cell_size: 120.0}
  keep_in_memory: True
  transforms: {common_transform: {dataset_name: ethanol}}
ethanol_val_dataset:
  <<: *ethanol_dataset
  splits: {val: {src: "${oc.env:PWD}/ethanol_train_0.db", sample_n: 100, seed: 1}}

train_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs: {ethanol: "${ethanol_train_dataset}"}
  combined_dataset_config: {sampling: {type: explicit, ratios: {ethanol.train: 1.0}}}
val_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs: {ethanol: "${ethanol_val_dataset}"}
  combined_dataset_config: {sampling: {type: explicit, ratios: {ethanol.val: 1.0}}}

train_dataloader: &loader
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${train_dataset}
  batch_sampler_fn: &sampler
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: True
    max_atoms: 90
    min_atoms: 1
    shuffle: True
    seed: 0
  num_workers: 0
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: "${tasks}"
    transforms: {random_o3_transform: {rotation: True, inversion: True}}
eval_dataloader:
  <<: *loader
  dataset: ${val_dataset}
  batch_sampler_fn: {<<: *sampler, shuffle: False}
  collate_fn: {_target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter, tasks: "${tasks}"}

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  max_epochs: ${epochs}
  callbacks: []
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
      _target_: fairchem.core.models.base.HydraModel
      backbone: {model: fairchem.core.models.pet.PET.PETBackbone, regress_forces: True, direct_forces: True, regress_stress: False, cutoff: 5}
      heads:
        # energy: {module: fairchem.core.models.pet.PET.PETEnergyHead}
        forces: {module: fairchem.core.models.pet.PET.PETDirectForceHead}
    optimizer_fn: {_target_: torch.optim.AdamW, _partial_: True, lr: 1e-4, weight_decay: 0.0}
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: True
      warmup_factor: 0.0
      warmup_epochs: 1
      lr_min_factor: 0.01
      epochs: ${epochs}
    print_every: 10
    clip_grad_norm: 1.0
    bf16: False
