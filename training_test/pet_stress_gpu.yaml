defaults:
  - dataset_stats
  - _self_

epochs: 1000

job:
  device_type: CUDA
  debug: True
  run_dir: ${oc.env:PWD}/runs
  run_name: pet_dummy_mad_stress

tasks:
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: energy
    level: system
    property: energy
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.PerAtomMAELoss}
      coefficient: 1
    out_spec: {dim: [1], dtype: float32}
    normalizer:
      _target_: fairchem.core.modules.normalization.normalizer.Normalizer
      mean: 0.0
      rmsd: ${energy.per_atom_residual_rmsd}
    element_references:
      _target_: fairchem.core.modules.normalization.element_references.ElementReferences
      element_references:
        _target_: torch.DoubleTensor
        _args_:
          - ${energy.element_references}
    datasets: [mad]
    metrics: [per_atom_mae]
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: forces
    level: atom
    property: forces
    train_on_free_atoms: True
    eval_on_free_atoms: True
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.L2NormLoss}
      reduction: mean
      coefficient: 1
    out_spec: {dim: [3], dtype: float32}
    normalizer:
      _target_: fairchem.core.modules.normalization.normalizer.Normalizer
      mean: 0.0
      rmsd: ${forces.rmsd}
    datasets: [mad]
    metrics: [rmse, mae]
  - _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
    name: stress
    level: system
    property: stress
    loss_fn:
      _target_: fairchem.core.modules.loss.DDPMTLoss
      loss_fn: {_target_: fairchem.core.modules.loss.MAELoss}
      reduction: mean
      coefficient: 1
    out_spec: {dim: [9], dtype: float32}
    normalizer:
      _target_: fairchem.core.modules.normalization.normalizer.Normalizer
      mean: 0.0
      rmsd: ${stress.rmsd}
    datasets: [mad]
    metrics: [rmse, mae]

mad_train_dataset: &mad_dataset
  format: ase_db
  splits: {train: {src: "${oc.env:PWD}/mad-test_mixed_db/data.db", sample_n: 5000, seed: 0}}
  a2g_args: {r_energy: True, r_forces: True, r_stress: True, r_edges: True, radius: 5.0, max_neigh: 20, external_graph_method: nvidia}
  keep_in_memory: True
  transforms: {common_transform: {dataset_name: mad}, stress_reshape_transform: {}}
mad_val_dataset:
  <<: *mad_dataset
  splits: {val: {src: "${oc.env:PWD}/mad-test_mixed_db/data.db", sample_n: 500, seed: 1}}

train_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs: {mad: "${mad_train_dataset}"}
  combined_dataset_config: {sampling: {type: explicit, ratios: {mad.train: 1.0}}}
val_dataset:
  _target_: fairchem.core.datasets.mt_concat_dataset.create_concat_dataset
  dataset_configs: {mad: "${mad_val_dataset}"}
  combined_dataset_config: {sampling: {type: explicit, ratios: {mad.val: 1.0}}}

train_dataloader: &loader
  _target_: fairchem.core.components.common.dataloader_builder.get_dataloader
  dataset: ${train_dataset}
  batch_sampler_fn: &sampler
    _target_: fairchem.core.datasets.samplers.max_atom_distributed_sampler.MaxAtomDistributedBatchSampler
    _partial_: True
    max_atoms: 500
    min_atoms: 1
    shuffle: True
    seed: 0
  num_workers: 0
  collate_fn:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter
    tasks: "${tasks}"
    transforms: {random_o3_transform: {rotation: True, inversion: True}}
eval_dataloader:
  <<: *loader
  dataset: ${val_dataset}
  batch_sampler_fn: {<<: *sampler, shuffle: False}
  collate_fn: {_target_: fairchem.core.units.mlip_unit.mlip_unit.mt_collater_adapter, tasks: "${tasks}"}

runner:
  _target_: fairchem.core.components.train.train_runner.TrainEvalRunner
  train_dataloader: ${train_dataloader}
  eval_dataloader: ${eval_dataloader}
  max_epochs: ${epochs}
  callbacks: []
  train_eval_unit:
    _target_: fairchem.core.units.mlip_unit.mlip_unit.MLIPTrainEvalUnit
    job_config: ${job}
    tasks: ${tasks}
    model:
      _target_: fairchem.core.models.base.HydraModel
      backbone: {model: fairchem.core.models.pet.PET.PETBackbone, regress_forces: True, direct_forces: True, regress_stress: True, direct_stress: True, max_neighbors: 20, cutoff: 6}
      heads:
        energy: {module: fairchem.core.models.pet.PET.PETEnergyHead}
        forces: {module: fairchem.core.models.pet.PET.PETDirectForceHead}
        stress: {module: fairchem.core.models.pet.PET.PETDirectStressHead}
    optimizer_fn: {_target_: torch.optim.AdamW, _partial_: True, lr: 1e-4, weight_decay: 0.0}
    cosine_lr_scheduler_fn:
      _target_: fairchem.core.units.mlip_unit.mlip_unit._get_consine_lr_scheduler
      _partial_: True
      warmup_factor: 0.2
      warmup_epochs: 1
      lr_min_factor: 0.01
      epochs: ${epochs}
    print_every: 10
    clip_grad_norm: 1.0
    bf16: False
